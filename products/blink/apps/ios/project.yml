name: BlinkMobile
options:
  bundleIdPrefix: dev.arach
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
packages:
  Blink:
    path: ../..
  Hudson:
    path: ../../../../../hudson
targets:
  BlinkMobile:
    type: application
    platform: iOS
    sources:
      - path: BlinkMobile
    dependencies:
      - package: Blink
        product: BlinkCore
      - package: Blink
        product: BlinkPeer
      - package: Hudson
        product: HudsonUI
    info:
      path: BlinkMobile/Info.plist
      properties:
        CFBundleDisplayName: Canvas
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: Canvas uses your local network to securely sync notes from your Mac.
        NSBonjourServices:
          - _blink-notes._tcp
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.arach.blink.mobile
        PRODUCT_NAME: Canvas
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 6.0
        DEVELOPMENT_TEAM: 2U83JFPW66
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: 1,2
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
schemes:
  BlinkMobile:
    build:
      targets:
        BlinkMobile: all
    run:
      config: Debug
