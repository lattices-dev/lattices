name: BlinkMobile
options:
  bundleIdPrefix: dev.arach
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
packages:
  Blink:
    path: ../..
  Hudson:
    url: git@github.com:arach/hudson.git
    revision: 79ca548b2b30335a3c37fb031a753481dedaaf79
targets:
  BlinkMobile:
    type: application
    platform: iOS
    sources:
      - path: BlinkMobile
    dependencies:
      - package: Blink
        product: BlinkCore
      - package: Blink
        product: BlinkPeer
      - package: Hudson
        product: HudsonUI
    info:
      path: BlinkMobile/Info.plist
      properties:
        CFBundleDisplayName: Canvas
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: Canvas uses your local network to securely sync notes from your Mac.
        NSBonjourServices:
          - _blink-notes._tcp
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.arach.blink.mobile
        PRODUCT_NAME: Canvas
        PRODUCT_MODULE_NAME: BlinkMobile
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 6.0
        DEVELOPMENT_TEAM: 2U83JFPW66
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: 1,2
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
  BlinkMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: BlinkMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.arach.blink.mobile.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Canvas.app/Canvas"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 6.0
        DEVELOPMENT_TEAM: 2U83JFPW66
schemes:
  BlinkMobile:
    build:
      targets:
        BlinkMobile: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BlinkMobileTests
