name: Release Package npm

# Hosted runner usage is opt in. Start this workflow manually from Actions.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to npm instead of running a dry run'
        required: false
        default: false
        type: boolean
      build_app:
        description: 'Rebuild the app (false reuses the signed app from the matching GitHub release)'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    runs-on: macos-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      # `npm publish` runs prepack (bin/lattices-build package), which builds
      # the Swift app — so this job needs the same HudsonKit git setup as the
      # macOS release: resolve hudson + its vox/swift dep over git, with voice.
      HUDSON_READ_TOKEN: ${{ secrets.HUDSON_READ_TOKEN }}
      LATTICES_HUDSON_SOURCE: git
      HUDSON_VOX_SOURCE: git
      HUDSONKIT_WITH_VOICE: "1"
      # Public packages use the same free tier as the signed release feed.
      LATTICES_TIER: free
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Select Xcode 26
        if: ${{ inputs.build_app || !inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          # Package.swift requires swift-tools 6.2 (Xcode 26); runner defaults to 16.4.
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "$xcode" ]]; then
            echo "No Xcode 26 found on this runner:" >&2
            ls -d /Applications/Xcode_*.app >&2
            exit 1
          fi
          echo "Using $xcode"
          sudo xcode-select -s "$xcode/Contents/Developer"

      - name: Configure private HudsonKit access
        if: ${{ inputs.build_app || !inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${HUDSON_READ_TOKEN:-}" ]]; then
            echo "::error::HUDSON_READ_TOKEN secret is not set. Add a read-only PAT for arach/hudson (+arach/vox)." >&2
            exit 1
          fi
          git config --global url."https://x-access-token:${HUDSON_READ_TOKEN}@github.com/".insteadOf "git@github.com:"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache verified speech binary dependency
        if: ${{ inputs.build_app || !inputs.publish }}
        run: bash tools/release/cache-speech-artifact.sh

      - name: Package dry run
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
        run: npm publish --dry-run --access public

      - name: Verify npm credentials
        if: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          set -euo pipefail
          user="$(npm whoami)"
          expected="${NPM_EXPECTED_USER:-arach}"
          if [ "$user" != "$expected" ]; then
            echo "::error::NPM_TOKEN authenticates as '$user', expected '$expected'. Set NPM_EXPECTED_USER if a different npm maintainer should publish."
            exit 1
          fi
          echo "NPM_TOKEN authenticates as $user."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_EXPECTED_USER: ${{ vars.NPM_EXPECTED_USER }}

      - name: Publish to npm
        if: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          set -euo pipefail
          # Reuse the verified release app when requested, so npm and the DMG
          # carry identical signed binaries without resolving dependencies again.
          if [[ "${{ github.event_name }}" == "push" || "${{ inputs.build_app }}" == "true" ]]; then
            npm run prepack
          else
            version="$(node -p 'require("./package.json").version')"
            assets="$(mktemp -d)"
            mount_dir="$(mktemp -d)"
            trap 'hdiutil detach "$mount_dir" >/dev/null 2>&1 || true' EXIT
            gh release download "v$version" --dir "$assets" --pattern Lattices.dmg --pattern release-manifest.json
            python3 - "$assets" "$version" <<'PY'
          import hashlib, json, pathlib, sys
          assets = pathlib.Path(sys.argv[1])
          manifest = json.loads((assets / 'release-manifest.json').read_text())
          assert manifest['version'] == sys.argv[2], 'Release version mismatch'
          assert manifest['tier'] == 'free', 'Public packages require the free tier'
          assert manifest['notarization'] == 'Accepted', 'Release was not notarized'
          assert hashlib.sha256((assets / 'Lattices.dmg').read_bytes()).hexdigest() == manifest['assets']['Lattices.dmg'], 'DMG hash mismatch'
          PY
            hdiutil attach "$assets/Lattices.dmg" -readonly -nobrowse -mountpoint "$mount_dir"
            app="$mount_dir/Lattices.app"
            codesign --verify --deep --strict "$app"
            spctl --assess --type execute "$app"
            signing_details="$(codesign -dv "$app" 2>&1)"
            [[ "$signing_details" == *"TeamIdentifier=2U83JFPW66"* ]]
            [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" == "$version" ]]
            revision="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sourceCommit"])' "$assets/release-manifest.json")"
            [[ "$(/usr/libexec/PlistBuddy -c 'Print :LatticesBuildRevision' "$app/Contents/Info.plist")" == "$revision" ]]
            ditto "$app" apps/mac/Lattices.app
            test -x apps/mac/Lattices.app/Contents/MacOS/Lattices
          fi
          # Publish the same payload under all supported names. Never replace
          # legacy packages with wrappers: installs, imports and startup paths stay valid.
          trap 'npm pkg set name=@lattices/lattices; hdiutil detach "${mount_dir:-/nonexistent}" >/dev/null 2>&1 || true' EXIT
          for package in @lattices/lattices @arach/lattices @lattices/cli; do
            npm pkg set "name=$package"
            npm publish --ignore-scripts --provenance --access public
          done
          npm pkg set name=@lattices/lattices
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ github.token }}
