name: Deploy site to Cloudflare

# Hosted runner usage is opt in. Start this workflow manually from Actions.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: cloudflare
      url: https://lattices-site.arach.workers.dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      # Site and docs (apps/site/)
      - run: bun install --frozen-lockfile
        working-directory: apps/site

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: test -n "$CLOUDFLARE_API_TOKEN"

      - name: Test, build protected assets, and deploy Worker
        run: bun run deploy:cloudflare
        working-directory: apps/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
