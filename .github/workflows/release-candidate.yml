name: Release Candidate

# Hosted runner usage is opt in. Start this workflow manually from Actions.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all:
    name: Package and app checks
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Show toolchain
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          swift --version
          xcodebuild -version

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck package sources
        run: bun run check:types

      - name: Package npm dry run
        run: npm publish --dry-run --access public

      - name: Build unsigned macOS DMG
        run: LATTICES_SKIP_SIGN=1 LATTICES_SKIP_NOTARIZE=1 bash tools/release/build-dmg.sh

      - name: Build iOS simulator app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project apps/ios/LatticesCompanion.xcodeproj \
            -scheme LatticesCompanion \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/lattices-ios-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            build
