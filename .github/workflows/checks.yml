name: Checks

# Hosted runner usage is opt in. Start this workflow manually from Actions.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.os }} source checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bun install --frozen-lockfile --cwd packages/host-linux

      - name: Typecheck package sources
        run: bun run check:types

      - name: Test CLI and source fixtures
        run: bun run test

      - name: Install Linux host test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y dbus-daemon ffmpeg

      - name: Test gateway and Linux host
        if: runner.os == 'Linux'
        run: bun test ./packages/gateway/test ./packages/host-linux/test

      - name: Select Xcode 26
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "$xcode" ]]; then
            echo "::error::Xcode 26 is required for the native package."
            exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          swift --version

      - name: Test shared Swift modules
        if: runner.os == 'macOS'
        run: bun run test:swift

      - name: Configure private Hudson access
        if: runner.os == 'macOS'
        shell: bash
        env:
          HUDSON_READ_TOKEN: ${{ secrets.HUDSON_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${HUDSON_READ_TOKEN:-}" ]]; then
            echo "::error::HUDSON_READ_TOKEN is required for the native package's pinned Hudson dependency."
            exit 1
          fi
          git config --global url."https://x-access-token:${HUDSON_READ_TOKEN}@github.com/".insteadOf "git@github.com:"

      - name: Test native app without live window probes
        if: runner.os == 'macOS'
        env:
          LATTICES_HUDSON_SOURCE: git
          HUDSONKIT_WITH_VOICE: "0"
          LATTICES_BUNDLE: "0"
        run: bun run test:app
