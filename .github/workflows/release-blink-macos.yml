name: Release Canvas macOS

# Hosted runner usage is opt in. Start this workflow manually from Actions.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 2.0.6'
        required: true
        type: string
      publish_release:
        description: 'Publish Canvas and Blink compatibility releases at the same commit after both images verify'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    name: Build, notarize, and publish Canvas
    runs-on: macos-26
    environment: release
    timeout-minutes: 60
    defaults:
      run:
        working-directory: products/blink
    env:
      BLINK_HUDSON_SOURCE: git
      HUDSON_READ_TOKEN: ${{ secrets.HUDSON_READ_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: ${{ inputs.publish_release }}

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail

          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "$xcode" ]]; then
            echo "No Xcode 26 found on this runner:" >&2
            ls -d /Applications/Xcode_*.app >&2
            exit 1
          fi

          echo "Using $xcode"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5

      - name: Configure private Hudson access
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${HUDSON_READ_TOKEN:-}" ]]; then
            echo "::error::HUDSON_READ_TOKEN secret is not set. Add a read-only PAT for arach/hudson." >&2
            exit 1
          fi
          git config --global url."https://x-access-token:${HUDSON_READ_TOKEN}@github.com/".insteadOf "git@github.com:"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          package_version="$(node -p "require('./packages/npm/package.json').version")"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            if [[ "$tag" != canvas-v* && "$tag" != blink-v* ]]; then
              echo "Unexpected Canvas release tag: $tag" >&2
              exit 1
            fi
            version="${tag#*-v}"
            publish_release="${{ inputs.publish_release }}"
          else
            version="${{ inputs.version }}"
            publish_release="${{ inputs.publish_release }}"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi
          if [[ "$version" != "$package_version" ]]; then
            echo "Release version $version does not match products/blink/packages/npm/package.json ($package_version)." >&2
            exit 1
          fi
          if [[ "$publish_release" != "true" && "$publish_release" != "false" ]]; then
            echo "Invalid publish_release value: $publish_release" >&2
            exit 1
          fi

          release_tag="canvas-v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "publish_release=$publish_release" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "PUBLISH_RELEASE=$publish_release" >> "$GITHUB_ENV"
          echo "BLINK_VERSION=$version" >> "$GITHUB_ENV"

      - name: Check release tag
        if: ${{ steps.version.outputs.publish_release == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          target_sha="$(git rev-parse HEAD)"
          for tag in "canvas-v$VERSION" "blink-v$VERSION"; do
            existing_sha="$(git ls-remote --tags origin "refs/tags/$tag^{}" | awk '{print $1; exit}')"
            if [[ -z "$existing_sha" ]]; then
              existing_sha="$(git ls-remote --tags origin "refs/tags/$tag" | awk '{print $1; exit}')"
            fi
            if [[ -n "$existing_sha" && "$existing_sha" != "$target_sha" ]]; then
              echo "Release tag $tag already exists at $existing_sha, not $target_sha." >&2
              exit 1
            fi
          done

      - name: Build editor bundle
        shell: bash
        run: |
          set -euo pipefail
          cd web/editor
          bun install --frozen-lockfile
          bun run build

      - name: Import Developer ID certificate
        env:
          CERT_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          keychain="$RUNNER_TEMP/blink-release.keychain-db"
          cert_path="$RUNNER_TEMP/developer-id-application.p12"
          cert_password="$(printf '%s' "$CERT_PASSWORD" | tr -d '\r\n')"
          keychain_password="$(printf '%s' "$KEYCHAIN_PASSWORD" | tr -d '\r\n')"

          printf '%s' "$CERT_BASE64" | tr -d '[:space:]' | base64 -D > "$cert_path"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert_path" \
            -k "$keychain" \
            -P "$cert_password" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$keychain"

          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/"Developer ID Application:/{print $2; exit}')"
          if [[ -z "$identity" ]]; then
            echo "Developer ID Application identity was not imported" >&2
            security find-identity -v -p codesigning "$keychain" >&2
            exit 1
          fi

          echo "BLINK_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$keychain"

      - name: Configure App Store Connect notarization
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID || secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID || secrets.APP_STORE_CONNECT_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail

          key_path="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_P8" > "$key_path"
          chmod 600 "$key_path"

          notary_args=(
            --key-id "$APP_STORE_CONNECT_KEY_ID"
            --key "$key_path"
          )
          if [[ -n "$APP_STORE_CONNECT_ISSUER_ID" ]]; then
            notary_args+=(--issuer "$APP_STORE_CONNECT_ISSUER_ID")
          fi
          xcrun notarytool store-credentials blink-notarytool "${notary_args[@]}"
          echo "BLINK_NOTARY_PROFILE=blink-notarytool" >> "$GITHUB_ENV"

      - name: Build signed Canvas CLI
        shell: bash
        run: bash tools/release/build-cli.sh

      - name: Build signed and notarized Canvas DMG
        shell: bash
        run: bash tools/release/build-dmg.sh "$VERSION"

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail

          cli_path="packages/npm/dist/canvas"
          test "$("$cli_path" --version)" = "$VERSION"
          cmp "$cli_path" packages/npm/dist/blink
          codesign --verify --strict --verbose=2 "$cli_path"
          mount_dir="$(mktemp -d "$RUNNER_TEMP/canvas-dmg.XXXXXX")"
          cleanup() {
            hdiutil detach "$mount_dir" >/dev/null 2>&1 || true
            rmdir "$mount_dir" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for filename in Canvas Blink; do
            dmg_path="dist/$filename.dmg"
            hdiutil verify "$dmg_path"
            xcrun stapler validate "$dmg_path"
            codesign --verify --verbose "$dmg_path"
            spctl --assess --type open --context context:primary-signature --verbose "$dmg_path"
            hdiutil attach "$dmg_path" -readonly -nobrowse -mountpoint "$mount_dir"
            app_path="$mount_dir/$filename.app"
            test -d "$app_path"
            test ! -L "$app_path"
            test "$(find "$mount_dir" -maxdepth 1 -name '*.app' | wc -l | tr -d ' ')" = 1
            test "$(plutil -extract CFBundleIdentifier raw "$app_path/Contents/Info.plist")" = "dev.arach.blink"
            test "$(plutil -extract CFBundleDisplayName raw "$app_path/Contents/Info.plist")" = "Canvas"
            test "$(plutil -extract CFBundleExecutable raw "$app_path/Contents/Info.plist")" = "Canvas"
            test "$(plutil -extract CFBundleShortVersionString raw "$app_path/Contents/Info.plist")" = "${VERSION%%-*}"
            bash ../../tools/release/verify-companion-signature.sh "$app_path"
            spctl --assess --type execute --verbose "$app_path"
            hdiutil detach "$mount_dir"
          done

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Canvas-${{ steps.version.outputs.version }}-release-assets
          path: |
            products/blink/dist/Canvas.dmg
            products/blink/dist/Blink.dmg
            products/blink/packages/npm/dist/canvas
            products/blink/packages/npm/dist/blink
          if-no-files-found: error

      - name: Publish Canvas and Blink compatibility releases
        if: ${{ steps.version.outputs.publish_release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp packages/npm/dist/canvas dist/canvas-macos-arm64
          cp packages/npm/dist/blink dist/blink-macos-arm64
          bash tools/release/publish-assets.sh "$VERSION" "$GITHUB_REPOSITORY" "$(git rev-parse HEAD)" "$PWD/dist"
