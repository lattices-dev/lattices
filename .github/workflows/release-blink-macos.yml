name: Release Blink macOS

# Hosted runner usage is opt in. Start this workflow manually from Actions.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 2.0.6'
        required: true
        type: string
      publish_release:
        description: 'Create/update the blink-vX.Y.Z tag and public GitHub Release after the assets verify'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    name: Build, notarize, and publish Blink
    runs-on: macos-26
    environment: release
    timeout-minutes: 60
    defaults:
      run:
        working-directory: products/blink
    env:
      BLINK_HUDSON_SOURCE: git
      HUDSON_READ_TOKEN: ${{ secrets.HUDSON_READ_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: ${{ inputs.publish_release }}

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail

          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "$xcode" ]]; then
            echo "No Xcode 26 found on this runner:" >&2
            ls -d /Applications/Xcode_*.app >&2
            exit 1
          fi

          echo "Using $xcode"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5

      - name: Configure private Hudson access
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${HUDSON_READ_TOKEN:-}" ]]; then
            echo "::error::HUDSON_READ_TOKEN secret is not set. Add a read-only PAT for arach/hudson." >&2
            exit 1
          fi
          git config --global url."https://x-access-token:${HUDSON_READ_TOKEN}@github.com/".insteadOf "git@github.com:"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          package_version="$(node -p "require('./packages/npm/package.json').version")"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            if [[ "$tag" != blink-v* ]]; then
              echo "Unexpected Blink release tag: $tag" >&2
              exit 1
            fi
            version="${tag#blink-v}"
            publish_release="${{ inputs.publish_release }}"
          else
            version="${{ inputs.version }}"
            publish_release="${{ inputs.publish_release }}"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi
          if [[ "$version" != "$package_version" ]]; then
            echo "Release version $version does not match products/blink/packages/npm/package.json ($package_version)." >&2
            exit 1
          fi
          if [[ "$publish_release" != "true" && "$publish_release" != "false" ]]; then
            echo "Invalid publish_release value: $publish_release" >&2
            exit 1
          fi

          release_tag="blink-v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "publish_release=$publish_release" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "PUBLISH_RELEASE=$publish_release" >> "$GITHUB_ENV"
          echo "BLINK_VERSION=$version" >> "$GITHUB_ENV"

      - name: Check release tag
        if: ${{ steps.version.outputs.publish_release == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          target_sha="$(git rev-parse HEAD)"
          existing_sha="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG^{}" | awk '{print $1; exit}')"
          if [[ -z "$existing_sha" ]]; then
            existing_sha="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | awk '{print $1; exit}')"
          fi
          if [[ -n "$existing_sha" && "$existing_sha" != "$target_sha" ]]; then
            echo "Release tag $RELEASE_TAG already exists at $existing_sha, not $target_sha." >&2
            exit 1
          fi

      - name: Build editor bundle
        shell: bash
        run: |
          set -euo pipefail
          cd web/editor
          bun install --frozen-lockfile
          bun run build

      - name: Import Developer ID certificate
        env:
          CERT_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          keychain="$RUNNER_TEMP/blink-release.keychain-db"
          cert_path="$RUNNER_TEMP/developer-id-application.p12"
          cert_password="$(printf '%s' "$CERT_PASSWORD" | tr -d '\r\n')"
          keychain_password="$(printf '%s' "$KEYCHAIN_PASSWORD" | tr -d '\r\n')"

          printf '%s' "$CERT_BASE64" | tr -d '[:space:]' | base64 -D > "$cert_path"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert_path" \
            -k "$keychain" \
            -P "$cert_password" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$keychain"

          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/"Developer ID Application:/{print $2; exit}')"
          if [[ -z "$identity" ]]; then
            echo "Developer ID Application identity was not imported" >&2
            security find-identity -v -p codesigning "$keychain" >&2
            exit 1
          fi

          echo "BLINK_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$keychain"

      - name: Configure App Store Connect notarization
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID || secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID || secrets.APP_STORE_CONNECT_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail

          key_path="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_P8" > "$key_path"
          chmod 600 "$key_path"

          notary_args=(
            --key-id "$APP_STORE_CONNECT_KEY_ID"
            --key "$key_path"
          )
          if [[ -n "$APP_STORE_CONNECT_ISSUER_ID" ]]; then
            notary_args+=(--issuer "$APP_STORE_CONNECT_ISSUER_ID")
          fi
          xcrun notarytool store-credentials blink-notarytool "${notary_args[@]}"
          echo "BLINK_NOTARY_PROFILE=blink-notarytool" >> "$GITHUB_ENV"

      - name: Build signed Blink CLI
        shell: bash
        run: bash tools/release/build-cli.sh

      - name: Build signed and notarized Blink DMG
        shell: bash
        run: bash tools/release/build-dmg.sh "$VERSION"

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail

          cli_path="packages/npm/dist/blink"
          dmg_path="dist/Blink.dmg"
          mount_dir="$(mktemp -d "$RUNNER_TEMP/blink-dmg.XXXXXX")"
          cleanup() {
            hdiutil detach "$mount_dir" >/dev/null 2>&1 || true
            rmdir "$mount_dir" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          test "$("$cli_path" --version)" = "$VERSION"
          codesign --verify --strict --verbose=2 "$cli_path"
          hdiutil verify "$dmg_path"
          xcrun stapler validate "$dmg_path"
          codesign --verify --verbose "$dmg_path"
          spctl --assess --type open --context context:primary-signature --verbose "$dmg_path"

          hdiutil attach "$dmg_path" -readonly -nobrowse -mountpoint "$mount_dir"
          app_path="$mount_dir/Blink.app"
          test "$(plutil -extract CFBundleIdentifier raw "$app_path/Contents/Info.plist")" = "dev.arach.blink"
          test "$(plutil -extract CFBundleShortVersionString raw "$app_path/Contents/Info.plist")" = "${VERSION%%-*}"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose "$app_path"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Blink-${{ steps.version.outputs.version }}-release-assets
          path: |
            products/blink/dist/Blink.dmg
            products/blink/packages/npm/dist/blink
          if-no-files-found: error

      - name: Create release tag
        if: ${{ github.event_name == 'workflow_dispatch' && steps.version.outputs.publish_release == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          target_sha="$(git rev-parse HEAD)"
          existing_sha="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG^{}" | awk '{print $1; exit}')"
          if [[ -z "$existing_sha" ]]; then
            existing_sha="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | awk '{print $1; exit}')"
          fi
          if [[ -n "$existing_sha" ]]; then
            echo "Release tag already exists at $existing_sha"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "Blink $VERSION" "$target_sha"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Publish GitHub release
        if: ${{ steps.version.outputs.publish_release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          dmg_path="$RUNNER_TEMP/Blink.dmg"
          versioned_dmg_path="$RUNNER_TEMP/Blink-$VERSION.dmg"
          cli_path="$RUNNER_TEMP/blink-macos-arm64"
          notes_path="$RUNNER_TEMP/blink-release-notes.md"
          cp dist/Blink.dmg "$dmg_path"
          cp dist/Blink.dmg "$versioned_dmg_path"
          cp packages/npm/dist/blink "$cli_path"

          cat > "$notes_path" <<EOF
          Blink $VERSION

          Download **Blink.dmg** for Mac (Apple Silicon), or install the CLI:

              npm install -g @arach/blink

          See the [Blink CLI reference](https://github.com/lattices-dev/lattices/blob/main/products/blink/docs/cli.md).
          EOF

          release_args=(--latest=false --title "Blink $VERSION" --notes-file "$notes_path")
          if [[ "$VERSION" == *-* ]]; then
            release_args+=(--prerelease)
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$dmg_path" "$versioned_dmg_path" "$cli_path" --clobber
            gh release edit "$RELEASE_TAG" "${release_args[@]}"
          else
            gh release create "$RELEASE_TAG" "$dmg_path" "$versioned_dmg_path" "$cli_path" \
              --verify-tag \
              "${release_args[@]}"
          fi
